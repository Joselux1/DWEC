<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes, Viajes y Reservas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="main.js"></script>
</head>
<body>
    <div class="container mt-4">
        <!-- Clientes Section -->
        <div class="card mb-4">
            <div class="m-3">
                <h5 class="card-title">Clientes</h5>
            </div>
            <div class="card-body ">
                <form class="mb-3 d-flex gap-2">
                    <input type="text" class="form-control  " placeholder="Nombre">
                    <input type="text" class="form-control" placeholder="Apellidos">
                    <input type="email" class="form-control" placeholder="Correo Electrónico">
                    <input type="text" class="form-control" placeholder="Teléfono">
                    <button type="button" class="btn btn-secondary btn-sm">Añadir Cliente</button>
                </form>
                <table class="table table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Rarek</td>
                            <td>Cruz</td>
                            <td>tarek@gmail.com</td>
                            <td>605325232</td>
                            <td><button class="btn btn-light btn-sm">Eliminar</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Viajes Section -->
        <div class="card mb-4">
            <div class="m-3">
                <h5 class="card-title">Viajes</h5>
            </div>
            <div class="card-body">
                <form class="mb-3 d-flex gap-2">
                    <input type="text" class="form-control" placeholder="Código">
                    <input type="text" class="form-control" placeholder="Destino">
                    <input type="number" class="form-control" placeholder="Precio">
                    <select class="form-control">
                        <option value="" selected disabled>Tipo de Viaje</option>
                        <option value="Paquete">Paquete</option>
                        <option value="Individual">Individual</option>
                    </select>
                    <button type="button" class="btn btn-secondary btn-sm">Añadir Viaje</button>
                </form>
                <table class="table table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Destino</th>
                            <th>Precio</th>
                            <th>Tipo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>222</td>
                            <td>Aruba</td>
                            <td>200</td>
                            <td>Paquete</td>
                            <td><button class="btn btn-light  btn-sm">Eliminar</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Reservas Section -->
        <div class="card mb-4">
            <div class="m-3">
                <h5 class="card-title">Reservas</h5>
            </div>
            <div class="card-body">
                <form class="mb-3 d-flex gap-2">
                    <select class="form-control">
                        <option value="" selected disabled>Seleccionar Cliente</option>
                    </select>
                    <select class="form-control">
                        <option value="" selected disabled>Seleccionar Viaje</option>
                    </select>
                    <button type="button" class="btn btn-secondary btn-sm">Crear Reserva</button>
                </form>
                <table class="table table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Cliente</th>
                            <th>Viaje</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Rarek Cruz</td>
                            <td>Aruba</td>
                            <td>19/11/2024</td>
                            <td><button class="btn btn-light btn-sm">Cancelar</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

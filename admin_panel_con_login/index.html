<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/main.js"></script>
    <script src="./libs/jquery-3.6.0.min.js"></script>
    <script src="./libs/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./libs/jquery.dataTables.min.css">
    <script src="./libs/jquery.dataTables.min.js"></script>

    <title>Formulario y registro</title>
</head>
<body>

   
    <div class ="container border  position-absolute top-50 start-50 translate-middle w-25 p-3">
      <form id="formulario">
        <div class="border border-black text-center text-light bg-primary mb-4 py-3" id="titulo">Inicio Sesion</div>
    
        <div class="mb-2">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="Introducir correo electrónico" required>
        </div>
        <div class="mb-2">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
        </div>
        <div class="mb-2 hidden" id="repetirPasswordDiv">
            <label for="repetirPassword" class="form-label">Repetir Contraseña</label>
            <input type="password" class="form-control" id="repetirPassword" placeholder="Repetir Contraseña">
        </div>
    
        <a class="link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" id="mostrar">¿Necesitas Registrate?</a>
        <br><br>
        <button type="submit" class="border border-black btn btn-primary mb-2 hidden" id="btnRegistrar">Registrar</button>
        <button type="submit" class="border border-black btn btn-primary mb-2" id="btnIniciarSesion">Iniciar Sesión</button>        
    </form>
    </div>







<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>

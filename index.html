<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Adivinanza de Números</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">¡Adivina el Número Secreto!</h1>

        <div class="form-group">
            <label for="dificultad">Selecciona el nivel de dificultad:</label>
            <select id="dificultad" class="form-control">
                <option value="facil">Fácil (1-10)</option>
                <option value="medio">Medio (1-50)</option>
                <option value="dificil">Difícil (1-100)</option>
            </select>
        </div>
        <div class="form-group">
            <input type="number" id="entradaNum" class="form-control" placeholder="Ingresa tu número aquí">
        </div>

  
        <button id="botonAdivinar" class="btn btn-primary btn-block">Adivinar</button>

  
        <div id="mensaje" class="mt-3 text-center"></div>
    </div>

    <script src="JS.js"></script>
</body>
</html>
